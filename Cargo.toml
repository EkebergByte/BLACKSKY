[package]
name = "blacksky"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
dotenvy = "0.15"
thiserror = "1.0"
